<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one working column. Header + store switch, sync strip, page tabs, then the active page (dashboard cards → supplier table → incoming → health; or a filterable table). SKU detail opens as a right-hand sheet. */
:root{
  --bg:#F4F5F8; --panel:#FFFFFF; --sunk:#ECEEF3; --fg:#1B1D26; --muted:#5C6273; --line:#DCE0E8;
  --accent:#86275F; --accent-soft:#F6E7F0; --on-accent:#FFFFFF;

  --gA:#86275F; --gB:#B76E99; --gC:#D9B3CA; --gD:#9AA0AE; --gN:#3C7BB0;
  --scrim:rgba(16,18,28,.38);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111319; --panel:#191C24; --sunk:#20242E; --fg:#E7E9F0; --muted:#9BA2B3; --line:#2C313D;
  --accent:#DE86BC; --accent-soft:#3A2233; --on-accent:#1B0F17;
  --ok:#53C691; --ok-soft:#173327; --warn:#E9A84A; --warn-soft:#352812; --bad:#F27B6E; --bad-soft:#3A1C1A; --info:#7DB3EA; --info-soft:#1A2A3D;
  --gA:#DE86BC; --gB:#B5689A; --gC:#7E5470; --gD:#5E6473; --gN:#6EA6D6; --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111319; --panel:#191C24; --sunk:#20242E; --fg:#E7E9F0; --muted:#9BA2B3; --line:#2C313D;
  --accent:#DE86BC; --accent-soft:#3A2233; --on-accent:#1B0F17;
  --ok:#53C691; --ok-soft:#173327; --warn:#E9A84A; --warn-soft:#352812; --bad:#F27B6E; --bad-soft:#3A1C1A; --info:#7DB3EA; --info-soft:#1A2A3D;
  --gA:#DE86BC; --gB:#B5689A; --gC:#7E5470; --gD:#5E6473; --gN:#6EA6D6; --scrim:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);margin:0}
.wrap{max-width:1480px;margin:0 auto;padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.45rem,2.6vw,2rem);font-weight:700}
h2{font-size:1.08rem;font-weight:600}
h3{font-size:.98rem;font-weight:600}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.num,td.n,th.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.sync{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.sync .stores{display:flex;flex-wrap:wrap;gap:8px 22px;min-width:0}
.storechip{display:flex;flex-direction:column;min-width:0}
.storechip b{font-weight:600}

.progress{grid-column:1/-1;display:grid;gap:6px}

.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--sunk);color:var(--muted)}
@media (max-width:640px){.sync{grid-template-columns:1fr}}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.82rem}

.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:500}

.nav{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.nav button{border:0;background:transparent;padding:10px 14px;border-bottom:2px solid transparent;font-weight:500;color:var(--muted);white-space:nowrap}
.nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.nav .count{font-family:var(--f-mono);font-size:.74rem;background:var(--sunk);border-radius:99px;padding:1px 7px;margin-left:6px}
.nav .count.hot{background:var(--bad-soft);color:var(--bad)}

main{display:grid;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.cardhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;margin-bottom:12px}

.stat4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;display:grid;gap:6px;align-content:start;text-align:left;width:100%;border-top:3px solid var(--tone)}
.stat:hover{border-color:var(--muted);border-top-color:var(--tone)}

.stat .locs{display:flex;flex-wrap:wrap;gap:6px}
.loc{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:1px 9px;font-size:.78rem}
.loc b{font-family:var(--f-mono);font-weight:500;margin-left:4px}
.loc:hover{border-color:var(--tone)}
.t-bad{--tone:var(--bad)} .t-warn{--tone:var(--warn)} .t-info{--tone:var(--info)} .t-neu{--tone:var(--fg)}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.two{grid-template-columns:1fr}}

.sev{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk);min-width:110px}
.sev i{display:block;height:100%}
.sevlab{display:flex;gap:10px;font-size:.76rem;color:var(--muted);margin-top:3px;font-family:var(--f-mono)}
.sevlab .o{color:var(--bad)} .sevlab .r{color:var(--warn)} .sevlab .s{color:var(--info)}
.badge{display:inline-block;border:1px dashed var(--muted);border-radius:99px;padding:0 8px;font-size:.76rem;color:var(--muted);background:none}
.badge:hover{border-style:solid;color:var(--fg)}

.inlist{display:grid;gap:0}
.inrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.inrow:last-child{border-bottom:0}
.inrow:hover .ttl{color:var(--accent)}
.inrow .ttl{font-weight:600}
.inrow .sub{font-size:.8rem;color:var(--muted)}
.inrow .when{text-align:right;font-family:var(--f-mono);font-size:.82rem}
.inempty{color:var(--muted);font-size:.86rem;padding:10px 0}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px;display:grid;gap:2px;align-content:start}

.kpilink{border:0;text-align:left;cursor:pointer;font:inherit;color:inherit;width:100%}

.gradebars{display:grid;gap:9px}

.stack{display:flex;height:20px;border-radius:5px;overflow:hidden;background:var(--sunk)}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.78rem;color:var(--muted)}

.workbench{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px;align-items:center;border-bottom:1px solid var(--line)}
.filters input[type=search],.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0;max-width:100%}
.filters input[type=search]{flex:1 1 220px}
.filters select{flex:0 1 170px}
.filters label.tog{display:flex;gap:6px;align-items:center;font-size:.86rem;color:var(--muted)}

.pagenote{padding:10px 12px 0;color:var(--muted);font-size:.85rem;max-width:120ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 11px;font-size:.84rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip b{font-family:var(--f-mono);font-weight:500;margin-left:4px}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}

thead th[data-col]{cursor:pointer}
th.n,td.n{text-align:right}
th[aria-sort="ascending"]::after{content:" ↑"}

tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--sunk)}

tfoot td{font-weight:600;border-bottom:0}
td.title{white-space:normal;min-width:220px;max-width:340px}
td.wrapc{white-space:normal;max-width:190px}

td.chk,th.chk{width:34px;padding-right:0}
input.qty,input.cell{width:72px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:right;font-family:var(--f-mono)}
input.cell.wide{width:90px}
.adjbtn{border:1px dashed var(--line);background:var(--bg);border-radius:6px;padding:2px 8px;font:inherit;font-family:var(--f-mono);display:inline-flex;gap:6px;align-items:center;color:inherit}
.adjbtn span{color:var(--muted);font-size:.72rem}
.adjbtn:hover{border-color:var(--accent);border-style:solid}
.adjbtn.neg{color:var(--bad)}
.adjprev{padding:10px 12px;background:var(--sunk);border-radius:8px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#drawer .modal.wide{width:min(940px,calc(100% - 32px))}

td .btn,td .badge,td .linkbtn{font-family:var(--f-body)}
.field input.textin{font-family:var(--f-body);text-align:left}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.74rem;font-weight:600;line-height:1.6;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

.grade{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font:600 .75rem var(--f-mono);color:var(--on-accent)}
.neg{color:var(--bad)}
.late{color:var(--bad);font-weight:600}
.pager{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:10px 12px;font-size:.85rem;color:var(--muted)}
.pager .btns{display:flex;gap:6px}
.selbar{position:sticky;bottom:env(safe-area-inset-bottom,0px);z-index:3;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 12px;background:var(--fg);color:var(--bg);border-radius:0 0 12px 12px}
.selbar select{padding:6px 8px;border-radius:7px;border:1px solid transparent;background:var(--bg);color:var(--fg);max-width:100%}
.selbar .btn{border-color:transparent}

.colpick{position:relative}
.colpanel{position:absolute;right:0;top:calc(100% + 6px);z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px 12px;display:grid;grid-template-columns:repeat(2,minmax(130px,1fr));gap:4px 16px;width:max-content;max-width:min(420px,calc(100vw - 32px))}
.colpanel label{display:flex;gap:6px;align-items:center;font-size:.84rem}

.empty{padding:44px 16px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 22px}
.form fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;align-content:start}

.field{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.88rem}
.field select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}

.textin{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);width:100%;min-width:0}
textarea.textin{min-height:64px;resize:vertical}
.pohead{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 18px;align-items:end}
.pohead label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.addbox{display:grid;gap:6px;max-width:760px}
.stepper{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}

.step{padding:2px 9px;border-radius:99px;border:1px solid var(--line)}
.step.on{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:600}
.dhead{flex-wrap:wrap}
.addrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.pocost{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 18px;align-items:start}
.pocost label{display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.totals{display:grid;grid-template-columns:auto auto;gap:3px 16px;margin:0;justify-content:end;font-size:.88rem}
.totals dt{color:var(--muted)}
.totals dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.totals .tot{font-weight:600;color:var(--fg);border-top:1px solid var(--line);padding-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

#drawer .scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
#drawer aside{position:fixed;top:0;right:0;bottom:0;z-index:31;width:min(600px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.18);overflow-y:auto;display:grid;gap:16px;align-content:start;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.dhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}

.facts b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.chartleg{display:flex;gap:14px;font-size:.78rem;color:var(--muted)}
.chartleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:.78rem;white-space:pre-line;max-width:260px;font-family:var(--f-mono)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.88rem;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Smash &amp; Venerate · inventory planning · version Nov 12</div>
      <h1>Stock Desk</h1>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div class="seg" id="storeSeg" role="group" aria-label="Store" hidden></div><a class="btn sm" href="/connect" style="text-decoration:none;color:inherit">Shopify stores</a><form method="post" action="/logout" style="margin:0"><button class="btn sm" type="submit">Sign out</button></form></div>
  </header>
  <section class="note bad" id="negAlert" hidden style="border-radius:12px;padding:12px 16px"></section>

  <section class="sync" aria-label="Store data">
    <div class="stores" id="storeChips"><div class="storechip"><b>No store synced yet</b><span>Sync pulls variants, stock, cost and 24 months of sales.</span></div></div>
    <div><button class="btn primary" id="syncBtn" type="button">Sync both stores now</button></div>
    <div class="progress" id="progress" hidden><div class="bar"><i id="progBar"></i></div><div class="muted small" id="progText"></div></div>
    <div class="note info" id="syncNote">Both stores sync automatically every hour. Press Sync to refresh now; a full sync takes a few minutes.</div>

(function(){

const S = {
  noRe:{}, adjs:{}, adj:null, inv:{q:"",status:"all",supplier:"",type:"",brand:"",grade:"",amin:"",amax:"",active:true,hist:false}, poQ:"", poLines:false, icolsOpen:false,

const REPL_ALL = ["rs","store","sku","title","variant","supplier","grade","onhand","incoming","inDraft","q1","q2","q3","q4","f30","base","stockout","reorder","params","qty","cost","price","margin","estCost","last","handle","barcode","vendor","type"];
const REPL_DEF = ["rs","store","sku","title","variant","supplier","onhand","incoming","q1","q2","q3","q4","f30","stockout","reorder","qty","cost","estCost"];

try{ const v=localStorage.getItem("stockdesk.view"); if(v) S.view=v; const p=localStorage.getItem("stockdesk.page"); if(p) S.page=p; }catch(e){}

const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtMoney = (v,dec) => v==null||!isFinite(v) ? "—" : (v<0?"−":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:dec?2:0,maximumFractionDigits:dec?2:0});
const fmtNum = (v,d=0) => v==null||!isFinite(v) ? "—" : v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtPct = v => v==null||!isFinite(v) ? "—" : (v*100).toFixed(0)+"%";
const ymd = d => d.toISOString().slice(0,10);
const parseDay = s => s ? Date.parse(String(s).slice(0,10)+"T00:00:00Z") : NaN;
const daysSince = s => { const t=parseDay(s); return isNaN(t)?null:Math.max(0,Math.round((TODAY-t)/DAY)); };
const dayDate = t => new Date(TODAY+t*DAY);
const fmtDay = t => { if(t==null) return "—"; const d=dayDate(t); return d.toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC", year: d.getUTCFullYear()!==CUR_Y?"2-digit":undefined}); };
const fmtIso = s => { const t=parseDay(s); if(isNaN(t)) return "—"; return new Date(t).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"}); };
const num = (v,d) => v==null||v===""||!isFinite(+v) ? d : +v;
const pill = (t,c) => `<span class="pill ${c}">${esc(t)}</span>`;

function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3600); }
async function use(name){ try{ return (window.claude && window.claude.use) ? await window.claude.use(name) : null; }catch(e){ return null; } }

/* ================= connector ================= */
function parsePayload(res){
  let p = res && res.payload;
  if(p && typeof p === "object") return p;
  let t = typeof p === "string" ? p : ((res && res.content)||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
  const m = t.match(/<DATA-RETURNED[^>]*>([\s\S]*?)<\/DATA-RETURNED/);
  const s = m ? m[1] : t;
  const i = s.indexOf("{"), j = s.lastIndexOf("}");
  if(i<0||j<i){ if(/rate limit|throttl|too many requests/i.test(t)) throw {code:"shopify_rate", message:t}; throw {code:"parse", message:"Shopify sent an answer this page could not read."}; }
  return JSON.parse(s.slice(i,j+1));
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const isRate = e => !!e && (e.code==="shopify_rate" || e.code==="rate_limited" || /rate limit|throttl|too many requests/i.test(String(e.message||"")));
const isTransient = e => !!e && (e.code==="server_unavailable" || /closed connection|mid-response|ECONNRESET|socket hang up|timed? ?out|-32000|\b50[234]\b|network/i.test(String(e.message||"")));
async function call(mcp, tool, input){
  let tries=0, retried=false, drops=0;
  for(;;){
    try{ return parsePayload(await mcp.callTool(SERVER, tool, input, {cache:false})); }
    catch(e){
      if(isRate(e) && tries<10){ const m=String(e.message||"").match(/wait\s+(\d+(?:\.\d+)?)\s*second/i); const base=e.retryAfterMs||(m?+m[1]*1000:1000); await sleep(base*(1+tries*0.6)+Math.random()*500); tries++; continue; }
      if(isTransient(e) && drops<5){ drops++; await sleep(2000*Math.pow(2,drops-1)+Math.random()*800); continue; }
      if(e && e.retryable && !retried){ retried=true; await sleep((e.retryAfterMs||1500)+Math.random()*800); continue; }
      if(e && e.message && /closed connection|mid-response/i.test(String(e.message))) e.message="The connection to Shopify kept dropping. Wait a minute and sync again.";
      throw e;
    }
  }
}
async function gql(mcp, query){
  for(let attempt=0; attempt<4; attempt++){
    const r = await call(mcp, "graphql_query", {query});
    if(r && r.data) return r.data;
    const msg = JSON.stringify((r&&r.errors)||r||"").slice(0,300);
    if(/THROTTLED|throttl/i.test(msg) && attempt<3){ await sleep(2500*(attempt+1)); continue; }
    throw {code:"tool_error", message:"Shopify query failed: "+msg};
  }
}
function errorText(e){
  switch(e && e.code){
    case "needs_reauth": return "Your Shopify connection has expired. Reconnect Shopify in claude.ai Settings → Connectors, then sync again.";
    case "server_not_connected": case "server_not_found": return "No Shopify connector is set up for your account. Add Shopify in claude.ai Settings → Connectors, then sync again.";
    case "selection_required": return "You have more than one Shopify connector. Choose which one this page should use when asked, then sync again.";
    case "not_in_manifest": return "Shopify access was declined for this page. Allow Shopify from the page's Permissions menu, then sync again.";
    case "approval_required": return "The Shopify request needs your approval. Press Sync again and choose Allow.";
    case "blocked_by_policy": return "Your organization blocks this Shopify tool for your account.";
    case "server_unavailable": return "Shopify didn't answer in time. Wait a minute and sync again.";
    case "not_granted": case "capability_disabled": case "capability_removed": return "Connector access isn't available in this view. Open the page in claude.ai to sync.";
    case "quota_exceeded": return "The page's storage is full, so this couldn't be saved. "+(e.message||"");
    case "invalid_argument": return "You don't have permission to save changes on this page.";
    default: return (e && e.message) ? e.message : "Something stopped unexpectedly.";
  }
}

/* ================= sync ================= */
function setProgress(frac, text){ $("progress").hidden=false; $("progBar").style.width=Math.round(Math.min(1,frac)*100)+"%"; $("progText").textContent=text; }
function showErr(t){ const el=$("syncErr"); el.textContent=t; el.hidden=false; }
const STATUS_CODE = {ACTIVE:"A", DRAFT:"D", ARCHIVED:"X"};

async function sync(){
  if(S.syncing) return;
  $("syncErr").hidden=true;
  const SV=window.StockDeskServer;
  S.syncing=true; $("syncBtn").disabled=true;
  try{
    await SV.startSync();
    setProgress(0.01,"Starting sync…");
    for(let idle=0;;){
      await sleep(2500);
      const st=await SV.syncState(), run=Object.entries(st.running||{});
      if(run.length){ idle=0; const f=run.reduce((s,[,v])=>s+(v.frac||0),0)/run.length; setProgress(f, run.map(([,v])=>v.step).join(" · ")); continue; }
      if(++idle<2) continue;
      const bad=(st.last||[]).filter(x=>x.ok===false);
      if(bad.length) showErr(bad.map(x=>`${x.store}: ${x.message}`).join(" · "));
      break;
    }
    await SV.refreshAll(); showNegatives();
    setProgress(1,"Sync finished."); toast("Stores synced");
  }catch(e){ showErr(errorText(e)); $("progress").hidden=true; }
  finally{ S.syncing=false; $("syncBtn").disabled=false; }
}
async function showNegatives(){
  try{
    const r=await window.StockDeskServer.negatives(), el=$("negAlert");
    const list=(r.stores||[]).filter(s=>s.items&&s.items.length);
    if(!list.length){ el.hidden=true; return; }
    el.hidden=false;
    el.innerHTML=`<b>Below-zero stock:</b> `+list.map(s=>`${esc(s.name)} <b class="num">${fmtNum(s.items.length)}</b> item${s.items.length===1?"":"s"}`).join(" · ")+` <button type="button" class="linkbtn" data-go="fix" style="margin-left:8px">See them in Data fixes</button><div class="small" style="margin-top:4px">`+list.map(s=>s.items.slice(0,6).map(x=>`${esc(x.sku||x.title)} (${x.onHand})`).join(", ")+(s.items.length>6?"…":"")).join("<br>")+`</div>`;
  }catch(e){}
}
setTimeout(showNegatives,1500); setInterval(showNegatives,5*60*1000);

/* ================= model ================= */
const decode = key => r => ({key:key+":"+r[0], store:key, id:r[0], sku:r[1], title:r[2], variant:r[3], color:r[4], handle:r[5], vendor:r[6], type:r[7],
  status:r[8], price:r[9], compareAt:r[10], cost:r[11], onhand0:r[12], onhand:r[12], created:r[13], u30:r[14], u90:r[15], u365:r[16], rev365:r[17], last:r[18], sd90:r[19],
  m:(r[20]&&r[20].length===24)?r[20]:null, barcode:r[21]||"", u30e:r[22]||0, u90e:r[23]||0, invItem:r[24]||"", loc:r[25]||"", committed:r[26]!=null?r[26]:null, inStock0:r[27]!=null?r[27]:null, shopIncoming:r[28]||0});

function dailyAt(r,t){ return r.base * (r.idx ? r.idx[MONTH_OF[Math.min(t,MONTH_OF.length-1)]] : 1); }
function demand(r,a,b){ if(!(r.base>0)) return 0; let s=0; for(let t=a;t<b;t++) s+=dailyAt(r,t); return s; }

function derive(){
  if(!S.dirty) return; S.dirty=false;
  const c=S.cfg.values, sup=S.cfg.suppliers, vmap=S.cfg.vendorMap;
  const inc=new Map(), draftQ=new Map();
  for(const po of Object.values(S.pos)){
    if(po.status==="draft"){ for(const l of po.lines||[]) draftQ.set(l.key,(draftQ.get(l.key)||0)+(+l.qty||0)); continue; }
    if(po.status!=="ordered" && po.status!=="partial") continue;
    const exp=po.expected?parseDay(po.expected):TODAY, t=isNaN(exp)?0:Math.max(0,Math.round((exp-TODAY)/DAY));
    for(const l of po.lines||[]){ const open=Math.max(0,(+l.qty||0)-(+l.received||0)); if(!open) continue; let a=inc.get(l.key); if(!a){a=[];inc.set(l.key,a);} a.push({t,q:open}); }
  }
  const adjMap=new Map();
  for(const a of Object.values(S.adjs)){ const st=S.stores[a.store]; if(!st || !(String(a.at)>String(st.meta.syncedAt))) continue; const k=a.store+":"+a.vid, p=adjMap.get(k); if(!p || String(a.at)>String(p.at)) adjMap.set(k,a); }
  S.rows=new Map();
  for(const key in S.stores){
    const rows=S.stores[key].rows;
    const sold=rows.filter(r=>r.rev365>0).sort((a,b)=>b.rev365-a.rev365);
    const tot=sold.reduce((s,r)=>s+r.rev365,0); let cum=0;
    for(const r of sold){ cum+=r.rev365; const sh=tot?cum/tot:1; r.grade = sh<=0.8||r===sold[0] ? "A" : sh<=0.95 ? "B" : "C"; }
    for(const r of rows){
      S.rows.set(r.key,r);
      { const la=adjMap.get(r.key); r.onhand = la ? (la.availAfter!=null?la.availAfter:r.onhand0+la.delta) : r.onhand0; r.inStock = la ? la.after : (r.inStock0!=null?r.inStock0:r.onhand0); }
      const ov=S.ovr[r.key]||{};
      r.age = r.created ? daysSince(r.created) : null;
      r.since = r.last ? daysSince(r.last) : null;
      if(!(r.rev365>0)) r.grade = r.u365>0 ? "C" : (r.age!=null && r.age<c.newDays ? "N" : "D");
      r.margin = r.cost!=null && r.price>0 ? (r.price-r.cost)/r.price : null;
      r.oh=Math.max(0,r.onhand);
      r.invCost = r.cost!=null ? r.oh*r.cost : null;
      r.invRetail = r.oh*r.price;
      r.supplier = ov.supplier || vmap[r.vendor] || r.vendor || "";
      const sp=sup[r.supplier]||{};
      r.lead=num(sp.lead,c.lead); r.safety=num(sp.safety,c.safety); r.cover=num(ov.cover,c.cover);
      // seasonality from the last 12 full months
      let idx=null;
      if(r.m && r.u365>=24){ let s=0; for(let i=11;i<23;i++) s+=r.m[i]; const avg=s/12;
        if(avg>0){ idx=new Array(12).fill(1); for(let i=11;i<23;i++) idx[calM(i)]=Math.min(2,Math.max(0.5,1+0.5*(r.m[i]/avg-1))); } }
      // actual daily sales over the chosen period, counting in-stock days only
      const oos = r.onhand<=0 && r.since!=null && r.since>0 && r.since<=120;
      const Wd = [30,90,365].includes(c.rateDays) ? c.rateDays : 90;
      const rate = Wd===30 ? (oos?Math.max(r.u30,r.u30e):r.u30)/30 : Wd===365 ? r.u365/(oos?Math.max(30,365-r.since):365) : (oos?Math.max(r.u90,r.u90e):r.u90)/90;
      r.ads = rate;
      let base=rate;
      if(idx && Wd<365){ let s=0; for(let t=1;t<=Wd;t++) s+=idx[PAST_MONTH[t]]; base=rate/((s/Wd)||1); }   // remove the period's seasonal lift, then re-apply per future month
      r.manual=false;
      if(ov.monthly!=null && ov.monthly!==""){ base=(+ov.monthly)/30.4; idx=null; r.manual=true; }
      r.base=base; r.idx=idx;
      r.f30 = demand(r,0,30);
      r.dos = r.ads>0 ? r.oh/r.ads : (r.oh>0?Infinity:null);
      const arr=inc.get(r.key)||[];
      r.incoming=arr.reduce((s,a)=>s+a.q,0); r.inDraft=draftQ.get(r.key)||0;
      r.stockout=null; r.reorderDay=null; r.qtySug=0; r.rs = base>0 ? "ok" : "none";
      if(r.status==="A" && base>0){
        const at=new Map(); for(const a of arr) at.set(a.t,(at.get(a.t)||0)+a.q);
        let stock=r.oh;
        for(let t=0;t<=365;t++){ stock+=at.get(t)||0; if(stock<=0){ r.stockout=t; break; } stock-=dailyAt(r,t); if(stock<=0){ r.stockout=t; break; } }
        if(r.stockout!=null) r.reorderDay=r.stockout-r.lead-r.safety;
        const need=demand(r,0,r.lead+r.safety+r.cover)-(r.oh+r.incoming);
        r.qtySug = need>0.25 ? Math.max(1,Math.ceil(need)) : 0;
        if(r.qtySug>0 && r.reorderDay!=null){
          if(r.onhand<=0 && !(at.get(0)>0)) r.rs="out";
          else if(r.reorderDay<=0) r.rs="now";
          else if(r.reorderDay<=c.soon) r.rs="soon";
        }
      }
      r.need = r.rs==="out"||r.rs==="now"||r.rs==="soon";
      r.lostPerDay = r.rs==="out" ? dailyAt(r,0)*r.price : 0;
      // markdowns
      r.md=null; r.mdPct=null; r.sale=null; r.newMargin=null; r.thin=false;
      if(r.status==="A" && r.onhand>0 && r.price>0 && r.grade!=="N"){
        const age = r.since!=null ? r.since : (r.age!=null ? r.age : 9999);
        let tier=null, pct=0;
        if(age>=c.dead){ tier="Clearance"; pct=c.d3; } else if(age>=c.aged){ tier="Mark down"; pct=c.d2; }
        else if(age>=c.slow){ tier="Promote"; pct=c.d1; } else if(r.ads>0 && r.dos>c.over){ tier="Overstock"; pct=c.d0; }
        if(tier){
          const floor = r.cost!=null ? (tier==="Clearance" ? r.cost : r.cost*(1+c.floor/100)) : 0;
          let sale=Math.ceil(r.price*(1-pct/100))-0.01;
          if(sale<floor) sale=Math.ceil(floor*100)/100; if(sale>r.price) sale=r.price;
          const eff=1-sale/r.price; r.md=tier; r.agingDays=age;
          if(eff>=0.04){ r.sale=sale; r.mdPct=eff; r.newMargin=r.cost!=null?(sale-r.cost)/sale:null; } else { r.thin=true; r.mdPct=0; }
        }
      }
      r.noReorder = !!(S.noRe[r.store] && S.noRe[r.store].has(r.id));
      r.deadEx = !!c.excludeDead && r.md==="Clearance";
      r.excluded = r.noReorder || r.deadEx;
      if(r.excluded){ r.rs="excl"; r.need=false; r.qtySug=0; r.lostPerDay=0; }
      const iss=[];
      if(r.onhand<0) iss.push("Negative stock");
      if(r.cost==null||r.cost===0) iss.push("No cost");
      if(r.cost>0 && r.price>0 && r.price<=r.cost) iss.push("Price at or below cost");
      if(!r.sku) iss.push("No SKU");
      if(!r.supplier) iss.push("No supplier");
      r.issues=iss;
    }
  }
}

/* ================= scope ================= */
const storeKeys = () => Object.keys(S.stores);
const scopeKeys = () => S.view==="all" ? storeKeys() : (S.stores[S.view] ? [S.view] : storeKeys());
function scopeRows(){ let out=[]; for(const k of scopeKeys()) out=out.concat(S.stores[k].rows); return out; }
const storeName = k => (S.stores[k]&&S.stores[k].meta.name)||k;
const shortStore = k => storeName(k).replace(/\s*beauty\s*supply\s*/i,"").trim()||storeName(k);
const poStores = po => [...new Set((po.lines||[]).map(l=>l.store))];
function posInScope(){ const ks=new Set(scopeKeys()); return Object.values(S.pos).filter(p=>{ const st=poStores(p); return !st.length || st.some(s=>ks.has(s)) || !storeKeys().length; }); }
const poUnits = po => (po.lines||[]).reduce((s,l)=>s+(+l.qty||0),0);
const poValue = po => (po.lines||[]).reduce((s,l)=>s+(+l.qty||0)*(+l.cost||0),0);
const poOpenUnits = po => (po.lines||[]).reduce((s,l)=>s+Math.max(0,(+l.qty||0)-(+l.received||0)),0);
const poOpenValue = po => (po.lines||[]).reduce((s,l)=>s+Math.max(0,(+l.qty||0)-(+l.received||0))*(+l.cost||0),0);
const poDue = po => { const t=parseDay(po.expected); return isNaN(t)?null:Math.round((t-TODAY)/DAY); };
const poStoreLabel = po => { const st=poStores(po); return st.length>1 ? "Combined" : st.length ? shortStore(st[0]) : "—"; };

/* ================= generic table ================= */
const PAGE=50;
function sortData(gid, defs, data, defSort){
  const s=S.sort[gid]||defSort, d=defs[s.key], out=data.slice();
  if(d) out.sort((a,b)=>{ let x=d.get(a), y=d.get(b);
    const xn=x==null||x===""||(typeof x==="number"&&isNaN(x)), yn=y==null||y===""||(typeof y==="number"&&isNaN(y));
    if(xn&&yn) return 0; if(xn) return 1; if(yn) return -1;
    return typeof x==="string" ? s.dir*x.localeCompare(y) : s.dir*(x-y); });
  return {data:out, s};
}
function gridHtml(gid, defs, cols, data, opts){
  const {data:rows, s} = sortData(gid, defs, data, opts.defSort);
  const pages=Math.max(1,Math.ceil(rows.length/PAGE)); let pg=S.pg[gid]||0; if(pg>=pages) pg=S.pg[gid]=pages-1;
  const slice=rows.slice(pg*PAGE, pg*PAGE+PAGE);
  let h=`<div class="tablewrap"><table><thead><tr>`;
  if(opts.select){ const allOn = rows.length>0 && rows.every(r=>S.sel.has(r.key)); h+=`<th class="chk"><input type="checkbox" id="selall_${gid}" data-selall="${gid}" ${allOn?"checked":""} aria-label="Select all ${rows.length} rows"></th>`; }
  for(const c of cols){ const d=defs[c]; const as=s.key===c?(s.dir>0?"ascending":"descending"):"none"; h+=`<th scope="col" data-grid="${gid}" data-col="${c}" class="${d.n?"n":""}" aria-sort="${as}" tabindex="0">${esc(d.label)}</th>`; }
  h+=`</tr></thead><tbody>`;
  if(!slice.length) h+=`<tr><td colspan="${cols.length+(opts.select?1:0)}" style="padding:28px 12px;text-align:center;white-space:normal" class="muted">${esc(opts.emptyText||"No rows match these filters.")}</td></tr>`;
  for(const r of slice){
    const picked = opts.select && S.sel.has(r.key);
    h+=`<tr class="row${picked?" picked":""}" ${opts.rowAttr?opts.rowAttr(r):""}>`;
    if(opts.select) h+=`<td class="chk"><input type="checkbox" data-sel="${esc(r.key)}" ${picked?"checked":""} aria-label="Select row"></td>`;
    for(const c of cols){ const d=defs[c]; h+=`<td class="${d.n?"n ":""}${d.cls||""}">${d.html(r)}</td>`; }
    h+="</tr>";
  }
  h+=`</tbody></table></div>`;
  if(rows.length>PAGE) h+=`<div class="pager"><span>${fmtNum(pg*PAGE+1)}–${fmtNum(Math.min(rows.length,(pg+1)*PAGE))} of ${fmtNum(rows.length)}</span><div class="btns"><button class="btn sm" type="button" data-pg="${gid}" data-dir="-1" ${pg===0?"disabled":""}>Previous</button><button class="btn sm" type="button" data-pg="${gid}" data-dir="1" ${pg>=pages-1?"disabled":""}>Next</button></div></div>`;
  return h;
}
const csvVal = v => { if(v==null||(typeof v==="number"&&!isFinite(v))) return ""; const s=String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
function csvFrom(defs, cols, data){ const lines=[cols.map(c=>csvVal(defs[c].label)).join(",")]; for(const r of data) lines.push(cols.map(c=>csvVal(defs[c].csv?defs[c].csv(r):defs[c].get(r))).join(",")); return lines.join("\n"); }
async function saveFile(filename, text){
  const dl=await use("downloads"); if(!dl){ toast("Downloads aren't available in this view"); return; }
  try{ await dl.save({filename, data:new Blob([text],{type:"text/csv"})}); toast("Export saved"); }
  catch(e){ if(e&&e.code==="declined") return; toast(e&&e.code==="rate_limited"?"Another save is waiting for you":"Export couldn't be saved"); }
}

function pageDash(){
  if(!hasData()) return emptyHtml();
  const keys=scopeKeys(), rows=scopeRows().filter(r=>r.status==="A");
  const g={out:[],now:[],soon:[]}; for(const r of rows) if(g[r.rs]) g[r.rs].push(r);
  const drafts=posInScope().filter(p=>p.status==="draft");
  const locs = (list, st) => keys.map(k=>{ const n=list.filter(r=>r.store===k).length; return `<button type="button" class="loc" data-go="repl" data-status="${st}" data-store="${esc(k)}">${esc(shortStore(k))}<b>${fmtNum(n)}</b></button>`; }).join("");
  const card = (st, tone, sub) => `<div class="stat ${tone}" role="group"><button type="button" class="linkbtn" data-go="repl" data-status="${st}" style="text-align:left;color:inherit;display:grid;gap:4px"><span class="eyebrow">${RS[st].label}</span><span class="v">${fmtNum(g[st].length)}</span><span class="s">${sub}</span></button><div class="locs">${locs(g[st],st)}</div></div>`;
  const val = list => fmtMoney(list.reduce((s,r)=>s+(r.cost!=null?r.qtySug*r.cost:0),0));
  let h=`<section class="stat4" aria-label="Stock status">
    ${card("out","t-bad",`No stock and still selling · ${val(g.out)} to reorder`)}
    ${card("now","t-warn",`Order date has passed · ${val(g.now)}`)}
    ${card("soon","t-info",`Order date within ${S.cfg.values.soon} days · ${val(g.soon)}`)}
    <div class="stat t-neu"><button type="button" class="linkbtn" data-go="po" data-pofilter="draft" style="text-align:left;color:inherit;display:grid;gap:4px"><span class="eyebrow">Draft POs pending</span><span class="v">${fmtNum(drafts.length)}</span><span class="s">${fmtMoney(drafts.reduce((s,p)=>s+poValue(p),0))} not yet sent to suppliers</span></button>
      <div class="locs">${keys.map(k=>`<span class="loc">${esc(shortStore(k))}<b>${fmtNum(drafts.filter(p=>poStores(p).includes(k)).length)}</b></span>`).join("")}</div></div>
  </section>`;

  // order by supplier
  const bySup=new Map();
  for(const r of rows){ if(!r.need) continue; const k=r.supplier||""; let s=bySup.get(k); if(!s){ s={name:k,out:0,now:0,soon:0,n:0,units:0,cost:0,lead:r.lead,safety:r.safety}; bySup.set(k,s); }
    s[r.rs]++; s.n++; s.units+=r.qtySug; s.cost+=r.cost!=null?r.qtySug*r.cost:0; }
  const sups=[...bySup.values()].sort((a,b)=> (a.name===""?1:0)-(b.name===""?1:0) || b.out-a.out || b.now-a.now || b.soon-a.soon || b.cost-a.cost);
  const draftBySup=new Map(); for(const p of drafts) draftBySup.set(p.supplier||"",(draftBySup.get(p.supplier||"")||0)+1);
  let st=`<div class="tablewrap"><table><thead><tr><th>Supplier</th><th class="n">To order</th><th>Severity</th><th class="n">Units</th><th class="n">Est. cost</th><th class="n">Lead / safety</th><th></th></tr></thead><tbody>`;
  if(!sups.length) st+=`<tr><td colspan="7" class="muted" style="padding:24px 12px;text-align:center;white-space:normal">Nothing needs ordering right now.</td></tr>`;
  for(const s of sups){
    const w=x=>s.n?(x/s.n*100).toFixed(2)+"%":"0";
    const nd=draftBySup.get(s.name)||0;
    st+=`<tr><td class="wrapc">${s.name?`<b>${esc(s.name)}</b>`:`<b>Unassigned</b><div class="muted small">Products without a supplier</div>`} ${nd?`<button type="button" class="badge" data-go="po" data-pofilter="draft" data-posup="${esc(s.name)}">${nd} draft${nd>1?"s":""}</button>`:""}</td>
      <td class="n"><b>${fmtNum(s.n)}</b></td>
      <td><div class="sev" data-tip="${esc(`Stocked out: ${s.out}\nReorder now: ${s.now}\nOrder soon: ${s.soon}`)}"><i style="width:${w(s.out)};background:var(--bad)"></i><i style="width:${w(s.now)};background:var(--warn)"></i><i style="width:${w(s.soon)};background:var(--info)"></i></div>
        <div class="sevlab"><span class="o">${s.out} out</span><span class="r">${s.now} now</span><span class="s">${s.soon} soon</span></div></td>
      <td class="n">${fmtNum(s.units)}</td><td class="n">${fmtMoney(s.cost)}</td>
      <td class="n">${s.name?`${s.lead}d / ${s.safety}d`:"—"}</td>
      <td class="n">${s.name?`<button type="button" class="btn sm primary" data-start="${esc(s.name)}">Start ordering</button>`:`<button type="button" class="btn sm" data-go="repl" data-status="need" data-supplier="__none">Assign suppliers</button>`}</td></tr>`;
  }
  st+=`</tbody></table></div>`;
  h+=`<section class="card" aria-label="Order by supplier"><div class="cardhead"><h2>Order by supplier</h2><span class="muted small">Counted per item per store · most urgent first</span></div>${st}</section>`;

  // incoming
  const open=posInScope().filter(p=>p.status==="ordered"||p.status==="partial");
  const overdue=open.filter(p=>{const d=poDue(p); return d!=null&&d<0;}).sort((a,b)=>poDue(a)-poDue(b));
  const soon=open.filter(p=>{const d=poDue(p); return d!=null&&d>=0&&d<=S.cfg.values.arrive;}).sort((a,b)=>poDue(a)-poDue(b));
  const noDate=open.filter(p=>poDue(p)==null);
  const inRow = (p, kind) => { const d=poDue(p); return `<button type="button" class="inrow" data-openpo="${esc(p.id)}"><div><div class="ttl">${esc(p.number)} · ${esc(p.supplier||"No supplier")}</div><div class="sub">${esc(poStoreLabel(p))} · ${fmtNum(poOpenUnits(p))} units still due · ${fmtMoney(poOpenValue(p))}${p.status==="partial"?" · partly received":""}</div></div><div class="when ${kind==="late"?"late":""}">${d==null?"No date":kind==="late"?`${-d} day${d===-1?"":"s"} late`:d===0?"Today":`in ${d} day${d===1?"":"s"}`}<div class="sub">${esc(fmtIso(p.expected))}</div></div></button>`; };
  h+=`<section class="two" aria-label="Incoming stock">
    <div class="card"><div class="cardhead"><h2>Overdue</h2><span class="muted small">${fmtNum(overdue.length)} PO${overdue.length===1?"":"s"} past expected date</span></div>
      <div class="inlist">${overdue.length?overdue.map(p=>inRow(p,"late")).join(""):`<div class="inempty">No overdue purchase orders.</div>`}</div>
      ${overdue.length?`<p class="muted small" style="margin-top:8px">Overdue stock still counts as arriving today, so these items can look covered when they aren't. Chase the supplier or update the expected date.</p>`:""}</div>
    <div class="card"><div class="cardhead"><h2>Arriving soon</h2><span class="muted small">Next ${S.cfg.values.arrive} days</span></div>
      <div class="inlist">${soon.length?soon.map(p=>inRow(p,"soon")).join(""):`<div class="inempty">Nothing expected in the next ${S.cfg.values.arrive} days.</div>`}${noDate.map(p=>inRow(p,"nodate")).join("")}</div></div>
  </section>`;
  h+=healthHtml(scopeRows().filter(r=>r.status==="A"));
  return h;
}

function healthHtml(rows){
  const sum=f=>rows.reduce((s,r)=>{const v=f(r);return s+(v!=null&&isFinite(v)?v:0);},0);
  const inv=sum(r=>r.invCost), retail=sum(r=>r.invRetail), rev=sum(r=>r.rev365), cogs=sum(r=>r.cost!=null?r.u365*r.cost:0);
  const turns=inv>0?cogs/inv:null, gmroi=inv>0?(rev-cogs)/inv:null;
  const md=rows.filter(r=>r.md), dead=rows.filter(r=>r.md==="Clearance");
  const k=(v,l,s,go)=> go ? `<button type="button" class="kpi kpilink" data-go="${go}"><span class="eyebrow">${l}</span><span class="v">${v}</span><span class="s">${s} · <span class="more">View list →</span></span></button>` : `<div class="kpi"><div class="eyebrow">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  const G=["A","B","C","D","N"], t={n:0,rev:0,inv:0}, g={}; for(const x of G) g[x]={n:0,rev:0,inv:0};
  for(const r of rows){ const b=g[r.grade]; if(!b) continue; b.n++; b.rev+=r.rev365>0?r.rev365:0; b.inv+=r.invCost||0; t.n++; t.rev+=r.rev365>0?r.rev365:0; t.inv+=r.invCost||0; }
  const bar=(lab,f)=>`<div class="gb"><div class="lab">${lab}</div><div class="stack" role="img" aria-label="${lab} by grade">${t[f]>0?G.map(x=>{const p=g[x][f]/t[f]; return p>0?`<span style="width:${(p*100).toFixed(2)}%;background:${GRADE_COLOR[x]}" data-tip="${x}: ${(p*100).toFixed(1)}%">${p>=0.08?x+" "+Math.round(p*100)+"%":""}</span>`:"";}).join(""):""}</div></div>`;
  return `<section class="card" aria-label="Inventory health"><div class="cardhead"><h2>Inventory health</h2><span class="muted small">Active products in scope</span></div>
    <div class="kpis">${k(fmtMoney(inv),"Stock at cost",`${fmtMoney(retail)} at retail`)}${k(turns==null?"—":turns.toFixed(1)+"×","Turns, 12 mo",`GMROI ${gmroi==null?"—":"$"+gmroi.toFixed(2)} per $1 of stock`)}${k(fmtNum(md.length),"Markdown candidates",`${fmtMoney(md.reduce((s,r)=>s+(r.invCost||0),0))} tied up`,"md")}${k(fmtMoney(dead.reduce((s,r)=>s+(r.invCost||0),0)),"Dead stock at cost",`${fmtNum(dead.length)} variants unsold ${S.cfg.values.dead}+ days`,"dead")}</div>
    <div style="margin-top:14px" class="gradebars">${bar("Variants","n")}${bar("12-mo net sales","rev")}${bar("Stock at cost","inv")}</div>
    <div class="legend">${G.map(x=>`<span><i style="background:${GRADE_COLOR[x]}"></i>${GRADE_NAME[x]}</span>`).join("")}</div></section>`;
}

function filteredRepl(){
  const f=S.rf, q=f.q.trim().toLowerCase();
  return scopeRows().filter(r=>{
    if(f.active && r.status!=="A") return false;
    if(r.excluded && f.status!=="excl") return false;
    if(f.status==="need"){ if(!r.need) return false; } else if(f.status!=="all" && r.rs!==f.status) return false;
    if(f.supplier==="__none"){ if(r.supplier) return false; } else if(f.supplier && r.supplier!==f.supplier) return false;
    if(f.type && r.type!==f.type) return false;
    if(f.grade && r.grade!==f.grade) return false;
    if(q && !(r.sku+" "+r.title+" "+r.variant+" "+r.color+" "+r.handle+" "+r.vendor+" "+r.barcode).toLowerCase().includes(q)) return false;
    return true;
  });
}

const uniq = a => [...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y));

function pageRepl(){

  const all=scopeRows(), rows=filteredRepl(), f=S.rf;
  const counts={need:0,out:0,now:0,soon:0,ok:0,excl:0}; for(const r of all){ if(f.active&&r.status!=="A") continue; if(r.need) counts.need++; if(counts[r.rs]!=null && r.rs!=="need") counts[r.rs]++; }
  const chip=(k,l,n)=>`<button type="button" class="chip" data-rstatus="${k}" aria-pressed="${f.status===k}">${l}${n!=null?`<b>${fmtNum(n)}</b>`:""}</button>`;
  const sups=supplierNames();
  let h=`<section class="workbench" aria-label="Replenishment">
   <div class="filters"><div class="chips">${chip("need","Needs action",counts.need)}${chip("out","Stocked out",counts.out)}${chip("now","Reorder now",counts.now)}${chip("soon","Order soon",counts.soon)}${chip("ok","Covered",counts.ok)}${chip("all","All")}${chip("excl","Never reorder",counts.excl)}</div></div>
   <div class="filters">
    <input type="search" id="rf_q" value="${esc(f.q)}" placeholder="Search SKU, title, color, barcode" aria-label="Search">
    <select id="rf_supplier" aria-label="Supplier"><option value="">All suppliers</option><option value="__none" ${f.supplier==="__none"?"selected":""}>Unassigned</option>${sups.map(v=>`<option value="${esc(v)}" ${v===f.supplier?"selected":""}>${esc(v)}</option>`).join("")}</select>
    <select id="rf_type" aria-label="Product type">${opts(uniq(all.map(r=>r.type)),f.type,"All product types")}</select>
    <select id="rf_grade" aria-label="Grade">${opts(["A","B","C","D","N"],f.grade,"All grades")}</select>
    <label class="tog" for="rf_active"><input type="checkbox" id="rf_active" ${f.active?"checked":""}> Active only</label>
    <span class="spacer"></span>
    <div class="colpick"><button class="btn" type="button" id="colBtn" aria-expanded="${S.colsOpen}">Columns</button>${S.colsOpen?`<div class="colpanel" role="group" aria-label="Visible columns">${REPL_ALL.map(c=>`<label for="col_${c}"><input type="checkbox" id="col_${c}" data-colt="${c}" ${COLS.includes(c)?"checked":""} ${LOCKED.has(c)?"disabled":""}> ${esc(C[c].label)}</label>`).join("")}</div>`:""}</div>
    <button class="btn" type="button" data-export="repl">Export CSV</button>
   </div>
   <p class="pagenote">Daily sales = units sold in the last ${RATE_LABEL[S.cfg.values.rateDays]||"90 days"} ÷ days in stock, adjusted for each item's seasonal pattern. Stock-out date = when on-hand plus confirmed incoming runs out at that rate. Order qty covers lead time + safety days + days of cover, minus stock on hand and confirmed incoming POs. Draft POs don't count as incoming. Dead stock and items marked “never reorder” are left out (see the Never reorder chip). Tap a row for its sales trend and overrides.</p>
   ${gridHtml("repl", C, COLS, rows, {select:true, defSort:{key:"rs",dir:1}, rowAttr:r=>`data-open="${esc(r.key)}"`, emptyText: f.status==="need"?"Nothing needs ordering with these filters.":"No items match these filters."})}
   ${selBarHtml()}
  </section>`;
  return h;
}
function selBarHtml(){
  if(!S.sel.size) return "";
  let units=0, cost=0; const sups=new Set();
  for(const [k,q] of S.sel){ const r=S.rows.get(k); if(!r) continue; units+=q; cost+=(r.cost||0)*q; sups.add(r.supplier); }
  const one = sups.size===1 ? [...sups][0] : null;
  const drafts = one!=null ? Object.values(S.pos).filter(p=>p.status==="draft" && (p.supplier||"")===one) : [];
  if(S.target!=="new" && !drafts.find(p=>p.id===S.target)) S.target="new";
  return `<div class="selbar" role="region" aria-label="Selected items">
    <div class="grow"><b>${fmtNum(S.sel.size)}</b> selected · ${fmtNum(units)} units · ${fmtMoney(cost,1)} at cost${sups.size>1?` · ${sups.size} suppliers (one PO each)`:""}</div>
    <select id="sb_split" aria-label="PO layout"><option value="store" ${S.split==="store"?"selected":""}>One PO per store</option><option value="combined" ${S.split==="combined"?"selected":""}>One combined PO</option></select>
    ${drafts.length?`<select id="sb_target" aria-label="Add to"><option value="new">New draft PO</option>${drafts.map(p=>`<option value="${esc(p.id)}" ${S.target===p.id?"selected":""}>Add to ${esc(p.number)}</option>`).join("")}</select>`:""}
    <button class="btn primary" type="button" id="createPo">${S.target!=="new"?"Add to draft":"Create draft PO"}</button>
    <button class="btn" type="button" id="clearSel">Clear</button></div>`;
}

  all:{cols:["store","sku","title","variant","handle","barcode","vendor","supplier","type","grade","pstatus","onhand","cost","price","margin","invCost","u30","u90","u365","rev365","last"], defSort:{key:"rev365",dir:-1}, rows:rs=>rs, note:()=>"Every variant in scope. Tap a row for its sales trend."},

function filteredT(){
  const f=S.tf, q=f.q.trim().toLowerCase();
  return scopeRows().filter(r=>{
    if(f.active && r.status!=="A") return false;
    if(f.vendor && r.supplier!==f.vendor) return false;
    if(f.type && r.type!==f.type) return false;
    if(f.grade && r.grade!==f.grade) return false;
    if(q && !(r.sku+" "+r.title+" "+r.variant+" "+r.color+" "+r.handle+" "+r.vendor+" "+r.barcode).toLowerCase().includes(q)) return false;
    return true; });
}

function poFiltered(){
  const all=posInScope(), f=S.poFilter, q=(S.poQ||"").trim().toLowerCase();
  const flt={open:p=>["draft","ordered","partial"].includes(p.status), draft:p=>p.status==="draft", ordered:p=>p.status==="ordered"||p.status==="partial", done:p=>p.status==="received"||p.status==="closed", all:()=>true};
  let list=all.filter(flt[f]||flt.open);
  if(S.poSup!=null) list=list.filter(p=>(p.supplier||"")===S.poSup);
  if(q) list=list.filter(p=>(String(p.number)+" "+(p.ref||"")+" "+(p.supplier||"")+" "+(p.notes||"")+" "+(p.lines||[]).map(l=>l.sku+" "+(l.vsku||"")+" "+l.barcode).join(" ")).toLowerCase().includes(q));
  return {all, list, flt};
}

const poTaxRate = p => Math.max(0,+p.taxPct||0)/100;
const poExtras = p => (+p.shipping||0)+(+p.duties||0);
const poTotal = p => poValue(p)*(1+poTaxRate(p))+poExtras(p);
function landedUnit(p,l){ const q=+l.qty||0; if(!q) return null; const sub=poValue(p), lv=q*(+l.cost||0); return (+l.cost||0)*(1+poTaxRate(p)) + (sub>0 ? poExtras(p)*lv/sub/q : (poUnits(p)?poExtras(p)/poUnits(p):0)); }
const mkLine = (r,q) => ({key:r.key, store:r.store, vid:r.id, sku:r.sku, barcode:r.barcode, title:r.title, variant:r.color||r.variant, qty:q, cost:r.cost, received:0, vsku:""});
function addResults(p){
  const q=(S.poAddQ||"").trim().toLowerCase(); if(q.length<2) return `<div class="muted small">Type at least 2 characters.</div>`;
  const st=poStores(p).length?poStores(p):(p.store?[p.store]:[]), inPo=new Set((p.lines||[]).map(l=>l.key)), out=[];
  for(const r of S.rows.values()){ if(r.status!=="A") continue; if(st.length && !st.includes(r.store)) continue;
    if(!(r.sku+" "+r.title+" "+r.variant+" "+r.color+" "+r.barcode).toLowerCase().includes(q)) continue; out.push(r); if(out.length>=8) break; }
  if(!out.length) return `<div class="muted small">No active items match${st.length===1?" in "+esc(shortStore(st[0])):""}.</div>`;
  return out.map(r=>`<div class="addrow"><span><span class="num">${esc(r.sku||"—")}</span> · ${esc(r.title)} · ${esc(r.color||r.variant||"")} <span class="muted">· ${esc(shortStore(r.store))} · ${fmtNum(r.onhand)} available${r.qtySug?` · suggests ${fmtNum(r.qtySug)}`:""}</span></span>${inPo.has(r.key)?'<span class="muted small">Added</span>':`<button type="button" class="btn sm" data-addline="${esc(r.key)}">Add</button>`}</div>`).join("");
}
function shipPerUnit(p,l){ const q=+l.qty||0; if(!q) return 0; const sub=poValue(p), lv=q*(+l.cost||0); return sub>0 ? poExtras(p)*lv/sub/q : (poUnits(p)?poExtras(p)/poUnits(p):0); }
function poDetail(p){
  const ro=S.canWrite===false, isDraft=p.status==="draft", isOpen=p.status==="ordered"||p.status==="partial", lines=p.lines||[], busy=!!S.poBusy;
  const editLine=(isDraft||isOpen)&&!ro, dis=(isDraft||isOpen)&&!ro&&!busy?"":"disabled";
  const step=k=>{ const order={draft:0,ordered:1,partial:1,received:2,closed:2}[p.status]; const idx={draft:0,incoming:1,closed:2}[k]; return `<span class="step ${idx<=order?"on":""}">${k==="draft"?"Draft":k==="incoming"?"Incoming":"Closed"}</span>`; };
  let tbl=`<div class="tablewrap"><table><thead><tr><th>SKU</th><th>Supplier SKU</th><th>Title</th><th>Variant / color</th><th>Barcode</th><th>Store</th><th class="n">Available</th><th class="n">Daily sales</th><th class="n">Stock-out</th><th class="n">Qty</th><th class="n">Unit cost</th><th class="n">Price</th><th class="n">Margin</th><th class="n">Ship / unit</th><th class="n">Line total</th><th class="n">Landed / unit</th>${isDraft?"":`<th class="n">Received</th>`}${isOpen?`<th class="n">Receive now</th>`:""}<th>Note</th>${isDraft&&!ro?"<th></th>":""}</tr></thead><tbody>`;
  lines.forEach((l,i)=>{
    const r=S.rows.get(l.key), price=r?r.price:(+l.price||null), lu=landedUnit(p,l), mg=price&&lu!=null?price-lu:null;
    tbl+=`<tr><td class="num">${esc(l.sku||"—")}</td>
      <td>${editLine?`<input class="cell wide" style="text-align:left" id="pl_v_${i}" data-pl="${i}" data-f="vsku" value="${esc(l.vsku||"")}" aria-label="Supplier SKU">`:`<span class="num">${esc(l.vsku||"—")}</span>`}</td>
      <td class="title">${r?`<button type="button" class="linkbtn" data-open="${esc(l.key)}" style="text-align:left">${esc(l.title)}</button>`:esc(l.title)}</td><td class="wrapc">${esc(l.variant||"—")}</td><td class="num">${esc(l.barcode||"—")}</td><td>${esc(shortStore(l.store))}</td>
      <td class="n">${r?fmtNum(r.onhand):"—"}</td><td class="n">${r?fmtNum(r.ads,2):"—"}</td><td class="n">${r?dayCell(r.stockout,true):"—"}</td>
      <td class="n">${isDraft&&!ro?`<input class="cell" type="number" min="0" step="1" id="pl_q_${i}" data-pl="${i}" data-f="qty" value="${+l.qty||0}" aria-label="Quantity">`:fmtNum(+l.qty||0)}</td>
      <td class="n">${isDraft&&!ro?`<input class="cell wide" type="number" min="0" step="0.01" id="pl_c_${i}" data-pl="${i}" data-f="cost" value="${l.cost!=null?l.cost:""}" aria-label="Unit cost">`:fmtMoney(+l.cost,1)}</td>
      <td class="n">${fmtMoney(price,1)}</td>
      <td class="n">${mg==null?"—":`<span class="${mg<0?"neg":""}" data-tip="${esc(`${fmtMoney(mg,2)} per unit after landed cost`)}">${fmtPct(mg/price)}</span>`}</td>
      <td class="n">${fmtMoney(shipPerUnit(p,l),2)}</td>
      <td class="n">${fmtMoney((+l.qty||0)*(+l.cost||0),1)}</td><td class="n">${fmtMoney(lu,2)}</td>
      ${isDraft?"":`<td class="n">${fmtNum(+l.received||0)}</td>`}
      ${isOpen?`<td class="n"><input class="cell" type="number" min="0" step="1" id="pl_r_${i}" data-recv="${i}" value="${S.recv[p.id+":"+i]||""}" placeholder="0" aria-label="Receive now" ${ro||busy?"disabled":""}></td>`:""}
      <td>${!ro?`<input class="cell" style="width:140px;text-align:left;font-family:var(--f-body)" id="pl_n_${i}" data-pl="${i}" data-f="note" value="${esc(l.note||"")}" aria-label="Line note">`:esc(l.note||"")}</td>
      ${isDraft&&!ro?`<td><button type="button" class="linkbtn" data-rmline="${i}">Remove</button></td>`:""}</tr>`;
  });
  if(!lines.length) tbl+=`<tr><td colspan="20" class="muted" style="padding:20px;text-align:center">No lines yet. Add products below, upload a CSV, or build from the Replenishment page.</td></tr>`;
  tbl+=`</tbody><tfoot><tr><td colspan="9">Total</td><td class="n">${fmtNum(poUnits(p))}</td><td></td><td></td><td></td><td></td><td class="n">${fmtMoney(poValue(p),1)}</td><td></td>${isDraft?"":`<td class="n">${fmtNum(poUnits(p)-poOpenUnits(p))}</td>`}${isOpen?"<td></td>":""}<td></td>${isDraft&&!ro?"<td></td>":""}</tr></tfoot></table></div>`;

function csvCols(h){
  const col=(...names)=>{ for(const n of names){ const i=h.indexOf(n); if(i>=0) return i; } for(const n of names){ const i=h.findIndex(x=>x.includes(n)); if(i>=0) return i; } return -1; };
  return { iS:col("sku","variant sku","item no","item #","item number"), iB:col("barcode","variant barcode","upc","ean","scan"),
    iQ:col("counted","qty","quantity","on hand","received","shipped","count"), iT:col("title","product name","description","item name","name") };
}
function makeMatcher(stores){
  const bySku=new Map(), byBc=new Map(), byTitle=new Map();
  const put=(m,k,r)=>{ if(!k) return; if(!m.has(k)) m.set(k,[]); m.get(k).push(r); };
  for(const r of S.rows.values()){ if(!stores.includes(r.store)) continue;
    put(bySku,normCode(r.sku),r); put(byBc,normCode(r.barcode),r);
    put(byTitle,(r.title+" "+(r.color||r.variant||"")).trim().toLowerCase(),r); if(!(r.color||r.variant)) put(byTitle,r.title.trim().toLowerCase(),r); }
  return (sku,bc,title)=>{ let m; const a=normCode(sku), b=normCode(bc);
    if(a && (m=bySku.get(a))) return {rows:m, by:"SKU"};
    if(b && (m=byBc.get(b))) return {rows:m, by:"Barcode"};
    if(a && (m=byBc.get(a))) return {rows:m, by:"Barcode"};
    if(b && (m=bySku.get(b))) return {rows:m, by:"SKU"};
    const t=String(title||"").trim().toLowerCase(); if(t && (m=byTitle.get(t))) return {rows:m, by:"Title"};
    return null; };
}
const csvQty = v => { const raw=String(v==null?"":v).trim(); if(!/\d/.test(raw)) return NaN; return Number(raw.replace(/[^0-9.\-]/g,"")); };
async function startCount(file){

function buildCount(){

    const q=csvQty(row[iQ]); if(!isFinite(q)||q<0){ c.bad.push(label); continue; }

    if(!m){ c.unmatched.push(label); continue; }
    if(m.rows.length>1){ c.multi.push(`${label} (${m.rows.length} listings)`); continue; }

  if(over.length) parts.push(`More than ordered (${over.length}): ${over.slice(0,15).join("; ")}${over.length>15?"…":""}`);
  if(short) parts.push(`${short} line${short===1?"":"s"} on the PO weren't in the file.`);
  if(notOnPo.length) parts.push(`In the file but not on this PO (${notOnPo.length}): ${notOnPo.slice(0,15).join(", ")}${notOnPo.length>15?"…":""}`);
  if(multi.length) parts.push(`Matched more than one PO line, so skipped (${multi.length}): ${multi.slice(0,15).join(", ")}`);
  if(unmatched.length) parts.push(`Didn't match any item (${unmatched.length}): ${unmatched.slice(0,15).join(", ")}${unmatched.length>15?"…":""}`);
  S.poMsg={id:p.id, cls:(notOnPo.length||unmatched.length||over.length)?"bad":"info", text:parts.join("\n")};
  render();
}
function parseCsv(text){ const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===','){ row.push(cur); cur=""; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=ch; }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!=="")); }
const normCode = v => String(v||"").trim().replace(/^'+/,"").replace(/^0+/,"").toUpperCase();
async function importCsv(p, file){
  let text; try{ text=await file.text(); }catch(e){ S.poMsg={id:p.id,cls:"bad",text:"Couldn't read that file."}; render(); return; }
  const rows=parseCsv(text); if(rows.length<2){ S.poMsg={id:p.id,cls:"bad",text:"The CSV has no data rows."}; render(); return; }
  const h=rows[0].map(x=>String(x).trim().toLowerCase());
  const col=(...names)=>{ for(const n of names){ const i=h.indexOf(n); if(i>=0) return i; } for(const n of names){ const i=h.findIndex(x=>x.includes(n)); if(i>=0) return i; } return -1; };
  const iV=col("supplier sku","vendor sku","supplier item","item no","item #");
  let iS=col("sku","variant sku"); if(iS===iV) iS=-1;
  const iB=col("barcode","upc","variant barcode","ean"), iQ=col("qty","quantity","order quantity","qty shipped","shipped"), iC=col("unit cost","cost","unit price","price");
  if(iQ<0 || (iS<0 && iB<0 && iV<0)){ S.poMsg={id:p.id,cls:"bad",text:"The CSV needs a quantity column and a SKU or barcode column (headers like SKU, Barcode, Qty, Unit cost)."}; render(); return; }
  const st=poStores(p).length?poStores(p):(p.store?[p.store]:storeKeys());
  const bySku=new Map(), byBc=new Map();
  for(const r of S.rows.values()){ if(!st.includes(r.store)) continue; if(r.sku) bySku.set(normCode(r.sku)+"|"+r.store, r); if(r.barcode) byBc.set(normCode(r.barcode)+"|"+r.store, r); }
  const find=code=>{ const c=normCode(code); if(!c) return null; for(const k of st){ const r=bySku.get(c+"|"+k)||byBc.get(c+"|"+k); if(r) return r; } return null; };
  let added=0, units=0; const miss=[];
  p.lines=(p.lines||[]).slice();
  for(const row of rows.slice(1)){
    const q=Math.floor(Number(String(row[iQ]||"").replace(/[^0-9.\-]/g,""))); if(!(q>0)) continue;
    const r=(iS>=0&&find(row[iS]))||(iB>=0&&find(row[iB]))||(iV>=0&&find(row[iV]));
    if(!r){ miss.push(String((iS>=0&&row[iS])||(iB>=0&&row[iB])||(iV>=0&&row[iV])||"?").trim()); continue; }
    let l=p.lines.find(x=>x.key===r.key); if(!l){ l=mkLine(r,0); p.lines.push(l); added++; }
    l.qty=(+l.qty||0)+q; units+=q;
    if(iC>=0){ const c=Number(String(row[iC]||"").replace(/[^0-9.]/g,"")); if(c>0) l.cost=Math.round(c*100)/100; }
    if(iV>=0 && row[iV] && iV!==iS) l.vsku=String(row[iV]).trim();
  }
  savePO(p);
  S.poMsg={id:p.id, cls:miss.length?"bad":"info", text:`Added ${fmtNum(units)} units (${fmtNum(added)} new lines) from ${file.name}.${miss.length?`\n${miss.length} row${miss.length===1?"":"s"} didn't match any item${st.length===1?" in "+storeName(st[0]):""}: ${miss.slice(0,20).join(", ")}${miss.length>20?"…":""}`:""}`};
  render();
}
function poText(p){
  const L=[`Purchase order ${p.number}`, `Supplier: ${p.supplier||"—"}`, `Ship to: ${poStores(p).map(storeName).join(", ")||"—"}`];
  if(p.shipBy) L.push(`Ship by: ${fmtIso(p.shipBy)}`); if(p.expected) L.push(`Requested delivery: ${fmtIso(p.expected)}`); if(p.terms) L.push(`Payment terms: ${p.terms}`); if(p.ref) L.push(`Reference: ${p.ref}`);
  L.push("", "Qty  | SKU / supplier SKU | Item | Unit cost | Total");
  for(const l of p.lines||[]) L.push(`${+l.qty||0}  | ${l.sku||""}${l.vsku?" / "+l.vsku:""} | ${l.title}${l.variant?" – "+l.variant:""} | ${fmtMoney(+l.cost,1)} | ${fmtMoney((+l.qty||0)*(+l.cost||0),1)}`);
  L.push("", `Units: ${fmtNum(poUnits(p))}`, `Subtotal: ${fmtMoney(poValue(p),1)}`);
  if(poTaxRate(p)) L.push(`Tax: ${fmtMoney(poValue(p)*poTaxRate(p),1)}`); if(+p.shipping) L.push(`Shipping: ${fmtMoney(+p.shipping,1)}`); if(+p.duties) L.push(`Duties & charges: ${fmtMoney(+p.duties,1)}`);
  L.push(`Total: ${fmtMoney(poTotal(p),1)}`); if(p.notes) L.push("", p.notes);
  return L.join("\n");
}

function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); for(const m of [1,2,2.5,5,10]) if(m*p>=v) return m*p; return 10*p; }
function trendSvg(r){
  const W=560,H=200,pl=34,pr=6,pt=10,pb=26;
  const bars=[];
  for(let i=12;i<24;i++) bars.push({lab:MON[calM(i)], v:r.m?r.m[i]:0, kind:i===23?"cur":"past"});
  for(let k=1;k<=12;k++){ const d=new Date(Date.UTC(CUR_Y,CUR_M+k,1)); const cm=d.getUTCMonth(); const dim=new Date(Date.UTC(d.getUTCFullYear(),cm+1,0)).getUTCDate();
    bars.push({lab:MON[cm], v:r.base*(r.idx?r.idx[cm]:1)*dim, kind:"proj"}); }
  const mx=niceMax(Math.max(1,...bars.map(b=>b.v))), bw=(W-pl-pr)/bars.length, y=v=>pt+(H-pt-pb)*(1-v/mx);
  let s=`<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Units sold per month for the last 12 months and projected for the next 12">`;
  for(const t of [0,mx/2,mx]) s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+3}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${fmtNum(t, t%1?1:0)}</text>`;
  const sx=pl+12*bw; s+=`<line x1="${sx}" x2="${sx}" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${sx+4}" y="${pt+9}" font-size="10" fill="var(--muted)">Projected</text>`;
  bars.forEach((b,i)=>{ const x=pl+i*bw+2, w=bw-4, yy=y(b.v), h=Math.max(b.v>0?1.5:0,H-pb-yy);
    const fill = b.kind==="proj" ? "var(--accent-soft)" : "var(--accent)";
    const stroke = b.kind==="proj" ? `stroke="var(--accent)" stroke-dasharray="3 2"` : "";
    s+=`<rect x="${x}" y="${H-pb-h}" width="${w}" height="${h}" rx="2" fill="${fill}" ${stroke} data-tip="${esc(`${b.lab}${b.kind==="proj"?" (projected)":b.kind==="cur"?" (so far)":""}: ${fmtNum(b.v,b.kind==="proj"?1:0)} units`)}"></rect>`;
    s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${b.lab.slice(0,1)}</text>`; });
  return s+`</svg>`;
}

async function callOnce(mcp, tool, input){ for(let t=0;;t++){ try{ return parsePayload(await mcp.callTool(SERVER, tool, input, {cache:false})); }catch(e){ if(isRate(e)&&t<6){ await sleep(1500*(t+1)+Math.random()*500); continue; } throw e; } } }

async function adjustShopifyMany(mcp, changes, reason){
  const input={name:"available", reason, changes};
  const sel="{ inventoryAdjustmentGroup { changes { name delta quantityAfterChange } } userErrors { field message code } }";
  const key=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():newId()+"-"+newId();
  let r;
  try{ r=await callOnce(mcp,"graphql_mutation",{query:`mutation StockDeskAdjust($input: InventoryAdjustQuantitiesInput!, $key: String!) { inventoryAdjustQuantities(input: $input) @idempotent(key: $key) ${sel} }`, variables:{input,key}}); }
  catch(e){ if(e && e.code==="tool_error" && /idempot|directive/i.test(String(e.message))) r=null; else throw e; }
  if(!r || (!r.data && r.errors && /idempot|directive/i.test(JSON.stringify(r.errors))))
    r=await callOnce(mcp,"graphql_mutation",{query:`mutation StockDeskAdjust($input: InventoryAdjustQuantitiesInput!) { inventoryAdjustQuantities(input: $input) ${sel} }`, variables:{input}});
  const p=r && r.data && r.data.inventoryAdjustQuantities;
  if(!p) throw {code:"tool_error", message:"Shopify didn't accept the change: "+JSON.stringify((r&&r.errors)||r||"").slice(0,240)};
  if(p.userErrors && p.userErrors.length) throw {code:"user", message:p.userErrors.map(e=>e.code==="CHANGE_FROM_QUANTITY_STALE"?"Stock changed in Shopify a moment ago. Press Update again.":e.message).join(" ")};
  return p;
}

    window.__sdStore=r.store; const meta=S.stores[r.store].meta, info=await call(mcp,"get-shop-info",{});
    if(String(info.domain||"").toLowerCase()!==String(meta.domain||"").toLowerCase()) throw {message:`Your Shopify connector is signed in to ${info.name||info.domain}, not ${meta.name}. Ask Claude to switch to ${meta.name}, then try again.`};
    const iid="gid://shopify/InventoryItem/"+r.invItem, lid="gid://shopify/Location/"+r.loc;
    const d=await gql(mcp,`{ inventoryItem(id: ${JSON.stringify(iid)}) { inventoryLevel(locationId: ${JSON.stringify(lid)}) { quantities(names: ["available","on_hand"]) { name quantity } } } }`);

    if(delta===0){ S.adj=null; toast(`Already ${fmtNum(Q.on_hand)} in stock. Nothing changed.`); render(); return; }
    await adjustShopify(mcp,iid,lid,delta,Q.available,a.reason);

    const id=newId(); S.adjs[id]=log; S.dirty=true; S.adj=null;

}

const W={}, timers={};
function queueWrite(path, body, op){ const w=W[path]||(W[path]={busy:false,next:null}); w.next={body,op:op||"set"}; if(!w.busy) flush(path); }
async function flush(path){ const w=W[path]; w.busy=true;
  while(w.next){ const n=w.next; w.next=null;
    if(!S.db) continue;
    try{ if(n.op==="delete") await S.db.doc(path).delete(); else await S.db.doc(path).set(n.body); }
    catch(e){ if(e&&e.code==="invalid_argument" && S.canWrite!==true){ S.canWrite=false; render(); } toast("Couldn't save: "+errorText(e)); } }
  w.busy=false; }
function debounced(path, fn, ms){ clearTimeout(timers[path]); timers[path]=setTimeout(()=>queueWrite(path, fn()), ms||500); }

async function pushReceipt(p, rc, sign){

  const ready=mine.filter(it=>{ const r=S.rows.get(p.lines[it.i].key); return r&&r.invItem&&r.loc; });
  if(!ready.length) return {err:"Sync this store again to turn on Shopify stock updates."};
  const loc="gid://shopify/Location/"+S.rows.get(p.lines[ready[0].i].key).loc;
  const ids=ready.map(it=>"gid://shopify/InventoryItem/"+S.rows.get(p.lines[it.i].key).invItem);
  try{
    const d=await gql(mcp,`{ nodes(ids: ${JSON.stringify(ids)}) { ... on InventoryItem { id inventoryLevel(locationId: ${JSON.stringify(loc)}) { quantities(names: ["available","on_hand"]) { name quantity } } } } }`);
    const lev={}; for(const n of (d.nodes||[])){ if(n&&n.inventoryLevel){ const Q={}; for(const x of n.inventoryLevel.quantities) Q[x.name]=x.quantity; lev[n.id]=Q; } }
    const changes=[], logs=[], at=new Date().toISOString();
    ready.forEach((it,k)=>{ const Q=lev[ids[k]]; if(!Q) return; const delta=sign*it.qty, l=p.lines[it.i];
      changes.push({inventoryItemId:ids[k], locationId:loc, delta, changeFromQuantity:Q.available});
      logs.push([it,{store:l.store, vid:l.vid||String(l.key).split(":").pop(), sku:l.sku||"", title:l.title, variant:l.variant||"", type:sign>0?"add":"sub", qty:it.qty, delta, before:Q.on_hand, after:Q.on_hand+delta, availAfter:Q.available+delta, reason:sign>0?"received":"correction", note:`${p.number} ${sign>0?"received":"receipt undone"}`, at}]); });
    if(!changes.length) return {err:"These items aren't stocked at the store's location in Shopify."};
    await adjustShopifyMany(mcp, changes, sign>0?"received":"correction");
    for(const [it] of logs) it.pushed=sign>0;
    for(const [,log] of logs){ const id=newId(); S.adjs[id]=log; try{ if(S.db) Promise.resolve(S.db.collection("adjustments").doc(id).set(log)).catch(()=>{}); }catch(e){} }
    S.dirty=true;
    return {done:logs.length, left:todo.length-logs.length};
  }catch(e){ return {err:errorText(e)}; }
}
function poStatusFromUnits(p){ const open=poOpenUnits(p); return open===0 ? "received" : open<poUnits(p) ? "partial" : "ordered"; }
async function poAction(act, arg){
  const p=S.pos[S.poOpen]; if(!p || S.poBusy) return;
  if(act==="copy"){ const text=poText(p);
    try{ navigator.clipboard.writeText(text).then(()=>toast("PO copied. Paste it into an email to your supplier."),()=>{ S.poCopy={id:p.id,text}; render(); }); }catch(e){ S.poCopy={id:p.id,text}; render(); }
    return; }
  if(act==="order"){ if(!(p.lines||[]).some(l=>+l.qty>0)){ toast("Add a quantity to at least one line first"); return; }
    p.status="ordered"; p.orderedAt=new Date().toISOString(); if(!p.expected) p.expected=ymd(new Date(TODAY+(p.leadDays||S.cfg.values.lead)*DAY));
    p.lines=(p.lines||[]).filter(l=>+l.qty>0); savePO(p); toast(`${p.number} marked as ordered`); }
  else if(act==="delete"){ if(S.confirm!==p.id){ S.confirm=p.id; setTimeout(()=>{ if(S.confirm===p.id){ S.confirm=null; render(); } },4000); render(); return; }
    S.confirm=null; delete S.pos[p.id]; S.dirty=true; queueWrite(`pos/${p.id}`,null,"delete"); S.poOpen=null; toast(`${p.number} deleted`); }
  else if(act==="close"){ if(S.confirm!==p.id){ S.confirm=p.id; setTimeout(()=>{ if(S.confirm===p.id){ S.confirm=null; render(); } },4000); render(); return; }
    S.confirm=null; p.status="closed"; p.closedAt=new Date().toISOString(); savePO(p); toast(`${p.number} closed`); }
  else if(act==="fillall"){ (p.lines||[]).forEach((l,i)=>{ const rem=Math.max(0,(+l.qty||0)-(+l.received||0)); S.recv[p.id+":"+i]=rem?String(rem):""; }); }
  else if(act==="receive"||act==="recvshop"){
    const items=[]; (p.lines||[]).forEach((l,i)=>{ const n=Math.max(0,Math.floor(+S.recv[p.id+":"+i]||0)); if(n>0) items.push({i, key:l.key, qty:n, pushed:false}); });
    if(!items.length){ toast("Enter quantities under Receive now, or press Fill all remaining"); return; }
    const rc={id:newId(), no:`${p.number}/${(p.receipts||[]).length+1}`, at:new Date().toISOString(), items};
    for(const it of items){ const l=p.lines[it.i]; l.received=(+l.received||0)+it.qty; delete S.recv[p.id+":"+it.i]; }
    p.receipts=(p.receipts||[]).concat([rc]); p.status=poStatusFromUnits(p); if(p.status==="received") p.receivedAt=rc.at;
    const units=items.reduce((s,it)=>s+it.qty,0);
    if(act==="recvshop"){ S.poBusy=true; savePO(p); render(); const res=await pushReceipt(p, rc, +1); S.poBusy=false;
      S.poMsg = res.err ? {id:p.id, cls:"bad", text:`Recorded ${fmtNum(units)} units on the PO, but Shopify wasn't updated: ${res.err}`} : {id:p.id, cls:"info", text:`Received ${fmtNum(units)} units and added ${fmtNum(res.done)} item${res.done===1?"":"s"} to Shopify stock.${res.left?` ${res.left} item${res.left===1?"":"s"} for another store still need adding: switch store, then use “Add to Shopify stock” below.`:""}`}; }
    else { S.poMsg={id:p.id, cls:"info", text:`Recorded ${fmtNum(units)} units on the PO. Shopify stock wasn't changed.`}; }
    savePO(p); }
  else if(act==="rcpush"){ const rc=(p.receipts||[]).find(x=>x.id===arg); if(!rc) return;
    S.poBusy=true; render(); const res=await pushReceipt(p, rc, +1); S.poBusy=false;
    S.poMsg = res.err ? {id:p.id, cls:"bad", text:res.err} : {id:p.id, cls:"info", text:`Added ${fmtNum(res.done)} item${res.done===1?"":"s"} to Shopify stock.`}; savePO(p); }
  else if(act==="rcundo"){ const rc=(p.receipts||[]).find(x=>x.id===arg); if(!rc) return;
    if(S.confirm!=="rc:"+rc.id){ S.confirm="rc:"+rc.id; setTimeout(()=>{ if(S.confirm==="rc:"+rc.id){ S.confirm=null; render(); } },4000); render(); return; }
    S.confirm=null;
    if(rc.items.some(it=>it.pushed)){ S.poBusy=true; render(); const res=await pushReceipt(p, rc, -1); S.poBusy=false;
      if(res.err || rc.items.some(it=>it.pushed)){ S.poMsg={id:p.id, cls:"bad", text:"Receipt not undone: "+(res.err||"some items are still in Shopify stock for another store. Switch store and try again.")}; savePO(p); render(); return; } }
    for(const it of rc.items){ const l=p.lines[it.i]; if(l) l.received=Math.max(0,(+l.received||0)-it.qty); }
    p.receipts=p.receipts.filter(x=>x.id!==rc.id); p.status=poStatusFromUnits(p); if(p.status!=="received") delete p.receivedAt;
    S.poMsg={id:p.id, cls:"info", text:"Receipt undone."}; savePO(p); }
  else if(act==="reopen"){ p.status = poOpenUnits(p)<poUnits(p) ? "partial" : "ordered"; savePO(p); }
  render();
}

  const st=t.closest("[data-start]");

  const pf=t.closest("[data-pofilter]"); if(pf){ S.poFilter=pf.dataset.pofilter; S.pg.pos=0; render(); return; }
  if(t.closest("#clearPoSup")){ S.poSup=null; render(); return; }
  if(t.closest("#poLinesBtn")){ S.poLines=!S.poLines; S.pg.polines=0; render(); return; }
  if(t.closest("#newPo")){ const id=newId(); const po={id, number:"PO-"+String(nextNumber()).padStart(4,"0"), supplier:"", status:"draft", createdAt:new Date().toISOString(), expected:"", notes:"", ref:"", store:S.view!=="all"&&S.stores[S.view]?S.view:"", lines:[]}; S.pos[id]=po; savePO(po); S.poOpen=id; S.poMsg=null; S.poAddQ=""; render(); setTimeout(()=>{ const el=$("po_supplier"); if(el) el.focus(); },0); return; }
  if(t.closest("#icolBtn")){ S.icolsOpen=!S.icolsOpen; render(); return; }
  if(S.icolsOpen && !t.closest(".colpanel")){ S.icolsOpen=false; render(); }
  if(t.closest("#colBtn")){ S.colsOpen=!S.colsOpen; render(); return; }
  if(S.colsOpen && !t.closest(".colpanel")){ S.colsOpen=false; render(); }
  const ex=t.closest("[data-export]"); if(ex){ exportCsv(ex.dataset.export); return; }
  if(t.closest("#createPo")){ createPOs(); return; }
  if(t.closest("#clearSel")){ S.sel.clear(); render(); return; }
  if(t.closest("#poBack")){ S.poOpen=null; S.poMsg=null; S.poCopy=null; S.poAddQ=""; render(); return; }
  const pa=t.closest("[data-poact]"); if(pa){ poAction(pa.dataset.poact); return; }
  const rm=t.closest("[data-rmline]"); if(rm){ const p=S.pos[S.poOpen]; if(p){ p.lines.splice(Number(rm.dataset.rmline),1); savePO(p); render(); } return; }
  const rcp=t.closest("[data-rcpush]"); if(rcp){ poAction("rcpush", rcp.dataset.rcpush); return; }
  const rcu=t.closest("[data-rcundo]"); if(rcu){ poAction("rcundo", rcu.dataset.rcundo); return; }
  const adl=t.closest("[data-addline]"); if(adl){ const po=S.pos[S.poOpen], r=S.rows.get(adl.dataset.addline); if(po&&r&&po.status==="draft"){ po.lines=(po.lines||[]).concat([mkLine(r,Math.max(1,r.qtySug))]); savePO(po); toast(`Added ${r.sku||r.title}`); render(); } return; }
  const op=t.closest("[data-openpo]"); if(op){ S.poOpen=op.dataset.openpo; S.confirm=null; S.poMsg=null; S.poCopy=null; S.poAddQ=""; if(S.page!=="po"){ go("po"); } else render(); return; }
  if(t.closest("#ovSave")){ saveOverrides(false); return; }
  if(t.closest("#ovReset")){ saveOverrides(true); return; }
  if(t.closest("#noReToggle")){ const r=S.rows.get(S.drawer); if(r){ setNoRe([r], !r.noReorder); toast(r.noReorder?"Reordering allowed again":"Marked never reorder"); render(); } return; }
  if(t.closest("#noReAll")){ const list=TBL.dead.rows(filteredT()).filter(r=>!r.noReorder); setNoRe(list,true); toast(`${fmtNum(list.length)} items marked never reorder`); render(); return; }
  if(t.closest("#ovAdd")){ const r=S.rows.get(S.drawer); if(r){ S.sel.set(r.key, Math.max(1,r.qtySug)); S.drawer=null; S.rf.status="all"; S.rf.q=r.sku||r.title; go("repl"); } return; }

  if(t.closest("input,button,a,select,textarea,label")) return;
  const row=t.closest("[data-open]"); if(row){ S.drawer=row.dataset.open; render(); }

    if(id==="po_csv"){ const f=t.files&&t.files[0]; t.value=""; if(f) importCsv(p,f); return; }
