    if(id==="po_track"){ p.tracking=t.value; savePO(p); return; }
    const pcm={po_ship:"shipping",po_duty:"duties",po_tax:"taxPct"}; if(pcm[id]){ const raw=t.value.trim(), v=Number(raw); if(raw===""){ delete p[pcm[id]]; } else if(isFinite(v)&&v>=0){ p[pcm[id]]=Math.round(v*100)/100; } else { render(); return; } savePO(p); scheduleRender(); return; }
    if(t.dataset.pl!=null && t.dataset.f==="vsku"){ const l=p.lines[Number(t.dataset.pl)]; if(l){ l.vsku=t.value.trim(); savePO(p); } return; }
    if(t.dataset.pl!=null){ const l=p.lines[Number(t.dataset.pl)]; if(!l) return; const v=Number(t.value); if(t.value===""||!isFinite(v)||v<0){ render(); return; } l[t.dataset.f] = t.dataset.f==="qty" ? Math.floor(v) : Math.round(v*100)/100; savePO(p); scheduleRender(); return; }
  }
});
function setNoRe(rows, on){
  const touched=new Set();
  for(const r of rows){ const s=S.noRe[r.store]||(S.noRe[r.store]=new Set()); if(on){ s.add(r.id); S.sel.delete(r.key); } else s.delete(r.id); touched.add(r.store); }
  for(const k of touched) queueWrite(`noreorder/${k}`, {ids:[...S.noRe[k]]});
  S.dirty=true;
}
function saveOverrides(reset){
  const r=S.rows.get(S.drawer); if(!r) return;
  const prev=S.ovr[r.key]||{}, keep={}; if(prev.alert!=null) keep.alert=prev.alert; if(prev.max!=null) keep.max=prev.max;
  if(reset){ delete S.ovr[r.key]; if(Object.keys(keep).length) S.ovr[r.key]=Object.assign({},keep); }
  else{ const o=Object.assign({},keep); const sv=$("ov_supplier").value.trim(), cv=$("ov_cover").value.trim(), mv=$("ov_monthly").value.trim();
    if(sv) o.supplier=sv; if(cv!==""&&isFinite(+cv)&&+cv>0) o.cover=Math.round(+cv); if(mv!==""&&isFinite(+mv)&&+mv>=0) o.monthly=+mv;
    if(Object.keys(o).length) S.ovr[r.key]=o; else delete S.ovr[r.key]; }
  saveOvr(); toast(reset?"Back to automatic values":"Overrides saved"); render();
}
function exportCsv(kind){
  const d=ymd(new Date(TODAY));
  if(kind==="inv"){ const {data}=sortData("inv",C,filteredInv(),{key:"title",dir:1}); if(!data.length){ toast("Nothing to export"); return; } saveFile(`inventory-${scopeSlug()}-${d}.csv`, csvFrom(C,INV_COLS,data)); return; }
  if(kind==="adj"){ const l=adjList(); if(!l.length){ toast("No adjustments yet"); return; } saveFile(`stock-adjustments-${scopeSlug()}-${d}.csv`, csvFrom(HC,Object.keys(HC),l)); return; }
  if(kind==="repl"){ let rows=filteredRepl(); if(S.sel.size) rows=rows.filter(r=>S.sel.has(r.key)); const {data}=sortData("repl",C,rows,{key:"rs",dir:1});
    if(!data.length){ toast("Nothing to export"); return; } saveFile(`replenishment-${scopeSlug()}-${d}.csv`, csvFrom(C,COLS,data)); return; }
  if(TBL[kind]){ const t=TBL[kind]; const {data}=sortData(kind,C,t.rows(filteredT()),t.defSort); if(!data.length){ toast("Nothing to export"); return; } saveFile(`${({md:"markdowns",fix:"data-fixes",dead:"dead-stock"})[kind]||"all-variants"}-${scopeSlug()}-${d}.csv`, csvFrom(C,t.cols,data)); return; }
  if(kind==="polines"){ const rows=poLineRows(poFiltered().list); if(!rows.length){ toast("No lines to export"); return; } saveFile(`po-lines-${d}.csv`, csvFrom(PLC,Object.keys(PLC),rows)); return; }
  if(kind==="pos"){ const list=poFiltered().list; if(!list.length){ toast("No purchase orders yet"); return; } saveFile(`purchase-orders-${d}.csv`, csvFrom(POC,Object.keys(POC),list)); return; }
  if(kind==="po"){ const p=S.pos[S.poOpen]; if(!p) return;
    const L=[["PO","Supplier","Store","Status","Expected","Payment terms","Reference","SKU","Supplier SKU","Barcode","Title","Variant / color","Qty","Unit cost","Line total","Landed cost / unit","Received","Note"].join(",")];
    for(const l of p.lines||[]){ const lu=landedUnit(p,l); L.push([p.number,p.supplier,storeName(l.store),POS[p.status].label,p.expected,p.terms||"",p.ref||"",l.sku,l.vsku||"",l.barcode,l.title,l.variant,+l.qty||0,l.cost!=null?(+l.cost).toFixed(2):"",((+l.qty||0)*(+l.cost||0)).toFixed(2),lu!=null?lu.toFixed(2):"",+l.received||0,l.note||""].map(csvVal).join(",")); }
    L.push(["","","","","","","","","","","Subtotal","","","",poValue(p).toFixed(2),"",""].map(csvVal).join(","));
    if(poTaxRate(p)) L.push(["","","","","","","","","","","Tax","","","",(poValue(p)*poTaxRate(p)).toFixed(2),"",""].join(","));
    if(+p.shipping) L.push(["","","","","","","","","","","Shipping","","","",(+p.shipping).toFixed(2),"",""].join(","));
    if(+p.duties) L.push(["","","","","","","","","","","Duties & charges","","","",(+p.duties).toFixed(2),"",""].join(","));
    L.push(["","","","","","","","","","","Total","","","",poTotal(p).toFixed(2),"",""].join(","));
    saveFile(`${p.number}-${String(p.supplier||"supplier").toLowerCase().replace(/\W+/g,"-")}.csv`, L.join("\n")); }
}

/* tooltip */
const tip=$("tip");
document.addEventListener("mouseover",e=>{ const el=e.target.closest&&e.target.closest("[data-tip]"); if(!el){ tip.hidden=true; return; } tip.textContent=el.getAttribute("data-tip"); tip.hidden=false; placeTip(e); });
document.addEventListener("mousemove",e=>{ if(!tip.hidden) placeTip(e); });
function placeTip(e){ const w=tip.offsetWidth, h=tip.offsetHeight; let x=e.clientX+14, y=e.clientY+14; if(x+w>innerWidth-8) x=e.clientX-w-14; if(y+h>innerHeight-8) y=e.clientY-h-14; tip.style.left=Math.max(8,x)+"px"; tip.style.top=Math.max(8,y)+"px"; }

/* ================= boot ================= */
render();
(async function boot(){
  const [db,user]=await Promise.all([use("db"),use("user")]);
  S.db=db;
  if(user){ try{ S.canWrite=await user.can("data.write"); }catch(e){} }
  if(S.canWrite===false){ $("syncBtn").disabled=true; $("syncNote").textContent="You can view both stores here. Syncing and editing need edit access to this page."; }
  if(!db){ $("syncNote").textContent="Saved data isn't available in this view. Syncing still works for this visit."; render(); return; }
  db.doc("config/settings").onSnapshot(s=>{ const d=s.exists?s.data():null; if(d){ S.cfg={values:Object.assign({},DEF,d.values||{}), suppliers:Object.assign({},d.suppliers||{}), vendorMap:Object.assign({},d.vendorMap||{})}; S.dirty=true; scheduleRender(); } }, ()=>{});
  db.collection("adjustments").onSnapshot(snap=>{ const n={}; for(const d of snap.docs) n[d.id]=JSON.parse(JSON.stringify(d.data()||{})); S.adjs=n; S.dirty=true; scheduleRender(); }, ()=>{});
  db.collection("noreorder").onSnapshot(snap=>{ const n={}; for(const d of snap.docs){ n[d.id]=new Set(((d.data()||{}).ids)||[]); } S.noRe=n; S.dirty=true; scheduleRender(); }, ()=>{});
  db.doc("config/overrides").onSnapshot(s=>{ const d=s.exists?s.data():null; S.ovr=JSON.parse(JSON.stringify((d&&d.map)||{})); S.dirty=true; scheduleRender(); }, ()=>{});
  db.collection("pos").onSnapshot(snap=>{ const next={}; for(const d of snap.docs){ next[d.id]=Object.assign(JSON.parse(JSON.stringify(d.data()||{})),{id:d.id}); } S.pos=next; S.dirty=true; scheduleRender(); }, ()=>showErr("Purchase orders stopped updating. Reload the page to reconnect."));
  const loaded={};
  db.collection("stores").onSnapshot(async snap=>{
    for(const d of snap.docs){
      const meta=d.data(); if(!meta||!meta.chunks) continue;
      if(loaded[d.id]===meta.syncedAt) continue;
      if(S.stores[meta.key] && S.stores[meta.key].meta.syncedAt===meta.syncedAt){ loaded[d.id]=meta.syncedAt; continue; }
      loaded[d.id]=meta.syncedAt;
      try{
        const parts=await Promise.all(Array.from({length:meta.chunks},(_,i)=>db.doc(`stores/${d.id}/chunks/c${i}`).get()));
        let rows=[]; for(const p of parts){ const b=p.exists?p.data():null; if(b&&b.rows) rows=rows.concat(b.rows); }
        S.stores[meta.key]={meta, rows:rows.map(decode(meta.key))}; S.dirty=true; scheduleRender();
      }catch(e){ loaded[d.id]=null; showErr("Couldn't load saved data for "+(meta.name||d.id)+". Reload the page to try again."); }
    }
  }, ()=>showErr("Saved store data stopped updating. Reload the page to reconnect."));
})();
})();
</script>
