# Render Blueprint: web app + hourly sync job + Postgres.
# Secrets (Shopify client IDs/secrets, logins, alert email key) are entered in the
# Render dashboard — they are marked "sync: false" and never stored in this repo.
services:
  - type: web
    name: stockdesk
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stockdesk-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_USERS
        sync: false
      - key: ALLOW_SHOPIFY_WRITES
        value: "false"
      - fromGroup: stockdesk-shopify

  - type: cron
    name: stockdesk-sync
    runtime: node
    plan: starter
    region: ohio
    schedule: "7 * * * *"
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm run sync
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stockdesk-db
          property: connectionString
      - fromGroup: stockdesk-shopify

envVarGroups:
  - name: stockdesk-shopify
    envVars:
      - key: SMASH_SHOP
        sync: false
      - key: SMASH_CLIENT_ID
        sync: false
      - key: SMASH_CLIENT_SECRET
        sync: false
      - key: VENERATE_SHOP
        sync: false
      - key: VENERATE_CLIENT_ID
        sync: false
      - key: VENERATE_CLIENT_SECRET
        sync: false
      - key: API_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ALERT_EMAIL
        sync: false
      - key: ALERT_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: stockdesk-db
    plan: basic-256mb
    region: ohio
    databaseName: stockdesk
    user: stockdesk
